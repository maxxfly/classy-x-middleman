  mending_to_wear:
    title: Mending to Wear
    p1: "Rather than encouraging the overconsumption of clothing on a planet already overwhelmed by textile waste, Classy X puts its expertise at the service of repair."
    p2: "We specialize in visible mending-an approach that transforms the marks of time into unique decorative features. Every stained, torn, or damaged garment is given a second life, reimagined through the creative language of our fashion house."
    p3: "Give your clothes a new story-one where repair becomes an act of creativity."
    p4: "Each project is quoted individually following a discussion and assessment of your request."
    p5: "Please contact us at <a href='mailto:cxdcouture@gmail.com'>cxdcouture@gmail.com</a> and include photographs of the garment you’d like us to transform."
    p6: "Below you’ll find a selection of our previous repair projects."
    p7: "Why repair instead of buying new clothes? Because repairing is a powerful act of social and environmental justice."
    p8: "By choosing our services, you’re supporting handcrafted work created and certified by the non-profit fashion house Classy X. Your contribution also helps us purchase essential materials for our community-focused and creative projects."


  galeries:
    zoom_hint: "Pinch to zoom"
    iconic: Our iconic designs
    iconic_description: Classy X design seeks to minimize its environmental impact, to use and reuse neglected materials. With these materials that are left behind, we create beautiful and timeless designs.

    photoshoots:
      title: "Photoshoots & Runway Shows"
      description: "Whether in the intimacy of a classroom, beneath the flashes of a photo studio, or in the volcanic heat of a runway, Diana seeks to celebrate identities and heritages that, like her own, have too often been marginalized and stigmatized.<br/><br/>At a time when the planet is burning and the rights of trans and queer people are increasingly under attack, our guiding principles remain eco-queerness and anti-consumerism."
    creation:
      title: Iconic Creations by Classy X
      description: As a child, Diana Apsara learned to sew alongside her Romani grandmother, for whom textile repair was a form of cultural transmission.<br/><br/>What began as a practical skill quickly became an intuitive and liberating creative practice-one that has remained at the heart of her work ever since.<br/><br/>Over the years, concepts such as DIY (Do It Yourself), upcycling, empowerment, stimming, and degrowth have shaped and strengthened her creative approach.<br/><br/>Here is a selection of Diana’s creations that have become iconic and now define the aesthetic identity of Classy X.
    workshop:
      title: Workshops / Classes / Behind the Scenes
      description: "Outside the logic of the commercial fashion system, Classy X Design has made a radical choice: to pass on its knowledge.<br/><br/>Repairing and transforming textiles has become a necessary act in response to trends that continue to exhaust both people and the planet.<br/><br/>Our workshops are spaces where students and collaborators come together to learn from one another under the artistic direction of founder Diana Apsara.<br/><br/>These workshops are designed with accessibility, knowledge-sharing, and, above all, individual and collective care at their core."

