    p2:
      line1: "En louant une création Classy X Design pour votre événement, vous sublimez les valeurs de la maison en plus d’avoir un look unique qui ne laissera pas indifférent. De plus, celà nous nous permet de racheter du matériel de base destiné à nos actions solidaires et créatives."


