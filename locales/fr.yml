---
fr:
  new_description:
    concept:
      title: "MAISON COUTURE"
      p1: "Classy X Design n'est pas une maison de mode comme les autres. Elle s'extrait des logiques élitistes et consuméristes des maisons de mode conventionnelles et invite à ne plus rester consommateurs·ices passif.ves mais à devenir acteur·ices de celle-ci."
      p2: "Aujourd'hui nous continuons à vivre au rythme du modèle de la croissance économique qui est un système mortifère pour la planète et l'humain."
      p3: "Comme si la seule façon d'exister était de posséder, au lieu de créer et de faire lien, de dominer au lieu de mettre l'empathie et le soin au cœur de nos pratiques de vie..."
      p4: "A travers nos initiatives, nous voulons prouver qu'il est possible d’habiter la mode de façon plus humaine et solidaire."
    working:
      title: "L'HISTOIRE DE CLASSY X DESIGN"
      p1: "En 2018-2019, la couturière plasticienne Diana Apsara fonde le collectif Classy X Design."
      p2: "Au fil des années, le collectif grandit et évolue pour devenir une maison de couture associative. Ce changement marque un tournant : la maison élargit son champ d’action en ouvrant ainsi le projet à la transmission des savoir-faire par la mise en place d'ateliers collaboratifs et de cours d'apprentissage des bases de l'upcycling."
      p3: "Plutôt que de consommer sans se questionner, nous invitons à réparer et repenser la mode en lui redonnant son pouvoir transformateur des consciences sous une perspective eco-queer et anti-consumériste."
    share:
      title: "PARTAGEZ AUTOUR DE VOUS"
      p1: "N'hésitez pas à nous suivre sur les réseaux sociaux pour être tenu informé et partagez autour de vous  pour contribuer au projet."
      p2: "Ne soyons plus fashion victimes, soyons le style et l'influence de demain ! "

  description:
    p1:
      line1: "ClassyX design est né d'une synergie entre amis et artistes (modèles, photographes, maquilleurs, stylistes, vidéastes) souhaitant s'émanciper de la mode mainstream."
      line2: "Travaillant sur l'ensemble des design, la mannequin et styliste Diana Apsara désire créer un espace plus inclusif à la diversité."
    cite1:
      line1: "J'ai toujours été fascinée par la pluralité des silhouettes."
      line2: "Quand je crée, j'aime imaginer le type de personne à qui cela pourrait correspondre. Je suis un peu dans une logique inverse de la plupart des créateurs. La standardisation de la beauté m'angoisse, elle nous prive de notre authenticité."
      line3: "Cela ne m'intéresse pas de créer une mode qui divise, mais d'intégrer, de mélanger les types de beautés."
    p2:
      line1: "ClassyX design choisit autant de modèles atypiques, plus size, transgenres, bodmodées, que de modèles classiques."
    cite2:
      line1: "La mode a une responsabilité envers les personnes qu'elle met de côté en imposant une image uniformisée de la beauté. Et quand elle s'essaye
         à la différence, ce n'est souvent que le temps d'un buzz. Ça ressemble plus à de l'exploitation qu'à de l'intégration"
    p3:
      line1: "Les membres participants au projet ClassyX design sont en majorité des femmes, plus size ou issus de la communauté LGBT.
         Etant directement représentatifs du publique auquel ils s'adressent: de l'empowerment sans compromis."
    p4:
      line1: "S'inscrivant dans une logique de mode plus éthique, les créations \"fait main\" sont upcyclées ou réalisées à partir de tissus et matériaux recyclés."
      line2: "Certains designs sont régulièrement disponibles sur la boutique en ligne."
      line3: "Le projet est en collaboration entre Paris, Londres et Montréal, avec l'espoir de s'élargir à d'autres villes:"
      line4: "ClassyX design est en permanente évolution et ne demande qu'à s'étendre."

  support:
    title: Aidez nous
    line1: Classy X Design est une association qui a besoin de votre soutien pour continuer à créer une mode engagée. N’hésitez pas à faire un don. Chaque donation nous aide à l’achat de matériel de base pour notre pratique de l’upcycling.
    line2: Vous avez plusieurs solutions
    line3: Nous suivre sur les réseaux sociaux
    line4: Partagez sur vos pages de réseaux sociaux
    line5: Et pourquoi pas craquer pour l'une de nos créations
    share_twitter: Marre de la dictature de la mode ? Envie d'une mode plus inclusive et plus éthique ? Partageons le projet classyxdesign !

  presse:
    title: Nos contributions

  products:
    title: Nos Créations

  mending_to_wear:
    title: Mending to Wear
    p1: "Plutôt que d’encourager la surconsommation de vêtements sur une planète déjà saturée de textiles, la maison Classy X met son savoir-faire au service de la réparation."
    p2: "Nous proposons des interventions de visible mending*; une approche qui sublime les marques du temps en les transformant en éléments esthétiques uniques. Chaque pièce abîmée, trouée ou tâchée retrouve ainsi une seconde vie, réinterprétée et signée par l’univers de notre maison."
    p3: "Offrez à vos vêtements une nouvelle histoire, où réparation rime avec créativité."
    p4: "Chaque projet fait l’objet d’un devis personnalisé, établi après échange et évaluation de votre demande."
    p5: "Nous contacter à <a href='mailto:cxdcouture@gmail.com'>cxdcouture@gmail.com</a>"
    p6: "avec des photos de votre vêtement à sublimer."
    p7: "Le visible mending est une pratique militante de réparation visible du vêtement. Elle s’oppose à l’obsolescence programmée et elle est un étendard de conscience écologique et d’anti-consumérisme."
    p8: "Pourquoi réparer plutôt qu’acheter des vêtements neufs ? Car réparer est un acte puissant pour la justice sociale et environnementale et qu’avec nous, vous avez la certification d’un travail fait main et certifié par la maison de mode associative Classy X. De plus, payer notre maison pour une réparation textile nous permet de racheter du matériel de base destiné à nos actions solidaires et créatives."

  galeries:
    zoom_hint: "Pincez pour zoomer"
    iconic: Nos créations phares
    iconic_description: Classy X design cherche à minimiser son impact environnemental et à éviter tout gâchis en utilisant et réutilisant des matériaux délaissés. Avec ces laissés pour compte nous créons des pièces uniques et intemporelles.

    photoshoots:
      title: "Photoshoots & défilés"
      description: "Que ce soit dans l’intimité d’une salle de cours, sous les flash d’un studio photo ou la chaleur volcanique d’un runway, Diana veut que soient célébrées des identités et des héritages trop souvent stigmatisés comme le sont les siens.<br/><br/>Et, à l’heure où la planète brûle et où les droits des personnes trans et queer sont particulièrement ciblés, les mots d’ordre sont éco-queer et anti-consumérisme."

    creation:
      title: Créations iconiques de Classy X 
      description: Enfant, c’est auprès de sa grand-mère rom pour qui la réparation textile était une transmission culturelle, que Diana Apsara apprend la couture.<br/><br/>Cette pratique, vite devenue intuitive et libératrice, ne la quittera plus.<br/><br/>Au fil des années émergent des notions comme - D.I.Y. (do it yourself), upcycling, empowerment, stimming, décroissance - et viennent renforcer ses procédés créatifs. Voici un échantillon des créations de Diana qui sont devenues iconiques et qui teintent aujourd’hui l’esthétique de la maison Classy X.
    workshop:
      title: Workshop/classe/coulisses
      description: "Hors du système marchand, Classy X Design fait un choix radical : transmettre ses savoir-faire.<br/><br/>Réparer et transformer le textile devient un acte nécessaire, face à des tendances qui épuisent le vivant.<br/><br/>Les workshops sont les espaces où les élèves et collaborateur ices de Classy X se croisent et apprennent ensemble, sous la direction artistique de la fondatrice Diana Apsara. Ces ateliers sont créés dans une perspective d'accessibilité, de partage mais aussi et surtout de soin à échelle individuelle & collective."

